<!DOCTYPE html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<title>Codex Usage Settings</title>
		<link rel="stylesheet" href="claude-auth.css" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<!--
			Settings auto-persist to the action via the `setting` attribute and apply live in the
			plugin (onDidReceiveSettings). Components: https://sdpi-components.dev/docs/components
		-->
		<div id="codex-auth">
			<sdpi-item label="Codex account"><button id="codex-connect" type="button">Connect Codex</button></sdpi-item>
			<sdpi-item><small id="codex-auth-status" role="status" aria-live="polite">Checking Codex login…</small></sdpi-item>
			<sdpi-item><button id="codex-cancel" type="button" hidden>Cancel sign-in</button></sdpi-item>
		</div>
		<sdpi-item label="Limit">
			<sdpi-select setting="window" default="auto">
				<option value="auto">Automatic (available window)</option>
				<option value="session">5-hour</option>
				<option value="weekly">7-day (weekly)</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item><small>One limit per key. Reset countdown: 04:10 or 3d 05:00.</small></sdpi-item>

		<sdpi-item label="Refresh interval (sec)">
			<sdpi-range setting="refreshIntervalSec" min="60" max="600" step="5" default="120" showlabels></sdpi-range>
		</sdpi-item>

		<sdpi-item label="Warning at (%)">
			<sdpi-range setting="warningThreshold" min="0" max="100" step="5" default="70" showlabels></sdpi-range>
		</sdpi-item>

		<sdpi-item label="Critical at (%)">
			<sdpi-range setting="criticalThreshold" min="0" max="100" step="5" default="90" showlabels></sdpi-range>
		</sdpi-item>

		<sdpi-item label="Credentials path">
			<sdpi-textfield setting="customCredentialsPath" placeholder="Leave empty for automatic login renewal"></sdpi-textfield>
		</sdpi-item>

		<sdpi-item>
			<small style="color: var(--sdpi-color-muted, #999);">
				Leave empty and use Connect Codex. Custom files are read-only and must be renewed by their owner.
			</small>
		</sdpi-item>
		<script src="codex-auth.js"></script>
	</body>
</html>
